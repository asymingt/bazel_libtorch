# Publish the Bazel registry (bazel_registry.json + modules/) to GitHub Pages
# on every merge to main, so other Bazel projects can use it with:
#
#   common --registry=https://<owner>.github.io/<repo>/
#   common --registry=https://bcr.bazel.build
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-registry:
    name: Publish registry to GitHub Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble registry site
        shell: bash
        run: |
          mkdir site
          cp .nojekyll bazel_registry.json site/
          cp -R modules site/modules

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
