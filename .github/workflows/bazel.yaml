# Reusable job: analyze + build (+ test) one (host, target) pair with one
# Bazel version. Called from pull_request.yaml for every native and cross job.
#
# Disk cache
# ----------
# The Bazel disk cache is managed here with actions/cache rather than by
# setup-bazel. setup-bazel keys it only on MODULE.bazel / lockfile / BUILD
# files and skips saving on an exact-key hit, so entries froze at their first
# save and changes to .bzl files, sources or patches never reached the cache.
#
# Instead, every job (except `last_rc`, see save_disk_cache) saves under a
# unique key
#   bazel-disk-v<cache_version>-[<variant>-]<host>-<target>-<sha>-<stage>-<run_attempt>
# and restores the most recent entry for the same commit (so `last_rc` picks up
# what `9.x` just produced, and a re-run picks up a partial cache saved on
# timeout), falling back to the most recent entry for the (host, target) pair.
# Before saving after a complete build, entries the build did not read or write
# are pruned (Bazel refreshes mtimes on hits), so each entry holds only the
# working set of the current commit and does not grow without bound. If the
# build hits its time limit before finishing, the unpruned cache (restored
# entries + everything compiled so far) is still saved so a re-run can resume.
#
# After a successful save, every older entry for the same (host, target) pair
# on the same ref is deleted, so main (and each PR) holds exactly one disk
# cache per pair. Otherwise every commit adds a full set and GitHub's LRU
# eviction ends up dropping whichever pair ran earliest, forcing it to rebuild
# libtorch from scratch.
name: Bazel job

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner label.
        required: true
        type: string
      bazel_version:
        description: USE_BAZEL_VERSION for bazelisk (e.g. 9.x, last_rc).
        required: true
        type: string
      stage:
        description: Short, key-safe name of the Bazel version stage.
        required: true
        type: string
      host:
        description: Host <os>-<arch>.
        required: true
        type: string
      target:
        description: Target <os>-<arch> (equal to host for native jobs).
        required: true
        type: string
      platform:
        description: Value for --platforms; empty for native (auto-detected) builds.
        required: false
        type: string
        default: ""
      flags:
        description: Extra Bazel flags for every command (e.g. --config=rocm).
        required: false
        type: string
        default: ""
      variant:
        description: >-
          Key-safe name for jobs whose `flags` change the build (e.g. rocm);
          gives them disk caches separate from the plain (host, target) pair.
        required: false
        type: string
        default: ""
      test:
        description: Run `bazel test //...` after building.
        required: false
        type: boolean
        default: false
      allow_failure:
        description: Do not fail the workflow if this job fails.
        required: false
        type: boolean
        default: false
      save_disk_cache:
        description: Save the disk cache after building (restore always happens).
        required: false
        type: boolean
        default: true
      cache_version:
        description: Bump to invalidate all Bazel caches.
        required: false
        type: string
        default: "2"

permissions:
  contents: read
  # Delete superseded disk cache entries (see "Delete superseded disk caches").
  actions: write

jobs:
  bazel:
    name: ${{ inputs.host == inputs.target && 'native' || 'cross' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    continue-on-error: ${{ inputs.allow_failure }}

    env:
      USE_BAZEL_VERSION: ${{ inputs.bazel_version }}
      PLATFORM_FLAG: ${{ inputs.platform != '' && format('--platforms={0}', inputs.platform) || '' }} ${{ inputs.flags }}
      # The variant goes before <host> so that no prefix matches another
      # variant's entries (restore-keys and `gh cache list --key` are prefix
      # matches).
      DISK_CACHE_PREFIX: bazel-disk-v${{ inputs.cache_version }}-${{ inputs.variant != '' && format('{0}-', inputs.variant) || '' }}${{ inputs.host }}-${{ inputs.target }}-
      DISK_CACHE_KEY: bazel-disk-v${{ inputs.cache_version }}-${{ inputs.variant != '' && format('{0}-', inputs.variant) || '' }}${{ inputs.host }}-${{ inputs.target }}-${{ github.sha }}-${{ inputs.stage }}-${{ github.run_attempt }}
      # Fixed forward-slash paths: Bazel's rc parser treats `\` as an escape, so
      # runner.temp (D:\a\_temp on Windows) cannot be used in a bazelrc.
      DISK_CACHE_DIR: ${{ startsWith(inputs.host, 'windows') && 'C:/_bzl_disk' || '/tmp/bazel-disk' }}
      DISK_CACHE_MARKER: ${{ startsWith(inputs.host, 'windows') && 'C:/_bzl_disk_marker' || '/tmp/bazel-disk-marker' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Windows Defender's real-time scan briefly locks freshly written files,
      # which surfaces as "Permission denied" both on disk cache entries and on
      # just-linked DLLs that lld then opens. Exclude Bazel's trees and the
      # disk cache.
      - name: Exclude Bazel directories from Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @('C:\_bzl', 'C:\_bazel', 'D:\_bazel', 'C:\_bzl_disk', $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE)
          Add-MpPreference -ExclusionPath $paths -ErrorAction SilentlyContinue
          Get-MpPreference -ErrorAction SilentlyContinue | Select-Object -ExpandProperty ExclusionPath

      # Bazel's repo contents cache (extracted repos) is kept outside
      # setup-bazel's repository cache directory (its default location), so the
      # saved repository cache holds only downloaded archives. It must be on
      # the same drive as the output base: Bazel moves fetched repos into it,
      # and on Windows a cross-drive move falls back to a copy that breaks
      # symlinks (e.g. the macOS SDK's usr/lib/libpthread.tbd). RUNNER_TEMP is
      # on the workspace drive, which is where setup-bazel puts the output base.
      - name: Compute Bazel paths
        shell: bash
        run: |
          temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then temp="$(cygpath -m "$temp")"; fi
          echo "REPO_CONTENTS_DIR=$temp/bazel-repo-contents" >> "$GITHUB_ENV"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true
          cache-version: ${{ inputs.cache_version }}
          # bazelisk/repository caches are keyed per runner OS/arch, so one job
          # per runner type (the native one) saving them is enough. actions/cache
          # archives the whole directory before finding out whether the key can
          # still be reserved, which costs 10-30 minutes per job on Windows.
          cache-save: ${{ inputs.host == inputs.target }}
          bazelrc: |
            ${{ runner.os == 'Windows' && 'startup --output_user_root=C:/_bzl' || '' }}
            build --disk_cache=${{ env.DISK_CACHE_DIR }}
            common --repo_contents_cache=${{ env.REPO_CONTENTS_DIR }}
            common --config=ci

      - name: Restore disk cache
        id: restore-disk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: |
            ${{ env.DISK_CACHE_PREFIX }}${{ github.sha }}-
            ${{ env.DISK_CACHE_PREFIX }}

      - name: Mark disk cache entries as stale
        shell: bash
        run: |
          mkdir -p "${{ env.DISK_CACHE_DIR }}"
          touch "${{ env.DISK_CACHE_MARKER }}"
          sleep 1

      - name: Bazel version
        shell: bash
        run: bazel version

      # --config=libtorch builds //... plus every @<module>//... of the local
      # registry (see libtorch.txt).
      - name: Analyze (${{ inputs.host }} -> ${{ inputs.target }})
        shell: bash
        run: bazel build --nobuild --config=libtorch $PLATFORM_FLAG

      # Stop the build after 5 hours to leave ~1 hour before GitHub's 360-minute
      # job timeout for `bazel shutdown` and uploading the cache. Cold builds on
      # slower runners can exceed 5h; saving the partial cache on timeout lets
      # a re-run resume where this attempt left off. Step-level
      # `timeout-minutes` is portable across Linux, macOS (which does not ship
      # GNU `timeout` on PATH) and Windows; when it triggers, the step outcome
      # is `failure` and the next step detects the timeout via elapsed
      # wall-clock time (`>= 17940s`).
      - name: Build (${{ inputs.host }} -> ${{ inputs.target }})
        id: build
        timeout-minutes: 300
        shell: bash
        run: |
          date +%s > "${{ runner.temp }}/build_start"
          bazel build --config=libtorch $PLATFORM_FLAG

      - name: Check if build timed out
        id: build-timeout
        if: always() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          start=$(cat "${{ runner.temp }}/build_start" 2>/dev/null || echo 0)
          elapsed=$(( $(date +%s) - start ))
          if [ "$start" -gt 0 ] && [ "$elapsed" -ge 17940 ]; then
            echo "::warning::Build ran for ${elapsed}s and hit the 300m time limit; saving partial disk cache so a re-run can resume."
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test (${{ inputs.host }})
        id: test
        if: inputs.test
        shell: bash
        run: bazel test $PLATFORM_FLAG //...

      - name: Force bazel shutdown to enable cache sync
        if: always()
        shell: bash
        run: bazel shutdown

      # Only prune after a complete build: after a failure or timeout,
      # untouched entries may still be needed by actions that never got to run.
      - name: Prune unused disk cache entries
        if: inputs.save_disk_cache && steps.build.outcome == 'success'
        shell: bash
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          before=$(du -sh "$dir" | cut -f1)
          find "$dir" -type f ! -newer "${{ env.DISK_CACHE_MARKER }}" -delete
          echo "Disk cache: $before -> $(du -sh "$dir" | cut -f1)"

      # Save after a successful build or when the build hit its time limit
      # (partial progress on top of the restored cache). Never save after a
      # normal compile failure or early cancellation: a broken commit failing
      # fast on a cold cache would save a near-empty entry that shadows the
      # last good one. `always()` keeps saving when the build timed out or when
      # only the tests failed.
      - name: Save disk cache
        id: save-disk-cache
        if: always() && inputs.save_disk_cache && (steps.build.outcome == 'success' || steps.build-timeout.outputs.timed_out == 'true') && steps.restore-disk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}

      # Keep exactly one disk cache per (host, target) pair per ref: once the
      # new entry is saved, older ones for the same pair are never restored
      # first again and only push the repo towards its cache quota. Scoped to
      # this run's ref, so a PR never touches main's caches. Only runs after a
      # successful save, so a failed build never removes the last good entry.
      # Non-fatal: fork PRs get a read-only token, and a leftover entry is
      # cleaned up by the next successful run (or cache_cleanup.yaml).
      - name: Delete superseded disk caches
        if: always() && steps.save-disk-cache.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP_KEY: ${{ env.DISK_CACHE_KEY }}
        run: |
          # --key is a prefix match; DISK_CACHE_PREFIX ends in '-', so it only
          # matches this exact (variant, host, target) combination.
          ids=$(gh cache list --ref "$GITHUB_REF" --key "$DISK_CACHE_PREFIX" --limit 100 \
            --json id,key --jq '.[] | select(.key != $ENV.KEEP_KEY) | .id')
          count=0
          for id in $ids; do
            gh cache delete "$id"
            count=$((count + 1))
          done
          echo "Kept $KEEP_KEY; deleted $count superseded entries on $GITHUB_REF"

      - name: Upload test logs on failure
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testlogs-${{ inputs.host }}-bazel${{ inputs.stage }}
          path: bazel-testlogs/**/test.log
          if-no-files-found: ignore
