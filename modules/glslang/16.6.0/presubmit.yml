matrix:
  platform:
    - debian11
    - macos_arm64
    - ubuntu2404
    - windows
  bazel: [8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@glslang//:glslang'
      - '@glslang//:glslang_lib'
      - '@glslang//:glslc'
