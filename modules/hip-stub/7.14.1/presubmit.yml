matrix:
  platform:
    - debian11
    - ubuntu2404
  bazel: [8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@hip-stub//:amd_smi_headers'
      - '@hip-stub//:amdhip64'
      - '@hip-stub//:hip_headers'
      - '@hip-stub//:hip_sdk'
      - '@hip-stub//:hiprtc'
      - '@hip-stub//:rocm_core_headers'
      - '@hip-stub//:roctx64'
