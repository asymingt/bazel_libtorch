# Bazel downloader rewrite rules (see --downloader_config).
#
# Adds mirrors for upstream tarballs that come from flaky hosts and that we
# cannot annotate with `mirror_urls` ourselves because the module lives in the
# Bazel Central Registry rather than in modules/.
#
# Semantics: patterns match the URL without its scheme; every matching
# `rewrite` line contributes one candidate URL, tried in order. An identity
# rewrite keeps the original URL as the final fallback.
#
# fontconfig 2.16.0 (BCR module) — www.freedesktop.org frequently times out.
# Fedora's lookaside cache serves the byte-identical upstream tarball.
rewrite www\.freedesktop\.org/software/fontconfig/release/fontconfig-2\.16\.0\.tar\.xz src.fedoraproject.org/repo/pkgs/fontconfig/fontconfig-2.16.0.tar.xz/sha512/90b5c39e5eadc56a9fbddd69b2a6eaa6bf9ee5cda003091b0896e66f87f3c1be8ab4442f54d20fca7232d72f60d9578f5e5ba3f376e39b64b8a2aa7b8f13b062/fontconfig-2.16.0.tar.xz
rewrite (www\.freedesktop\.org/software/fontconfig/release/fontconfig-2\.16\.0\.tar\.xz) $1

# ffmpeg 7.1.1 (BCR module) — ffmpeg.org has failed DNS resolution on CI
# runners ("Unknown host"), which Bazel treats as unrecoverable for that URL.
# Keep the upstream URL first; fall back to the Wayback Machine's capture,
# which is byte-identical (matches the BCR integrity hash).
rewrite (ffmpeg\.org/releases/ffmpeg-7\.1\.1\.tar\.xz) $1
rewrite (ffmpeg\.org/releases/ffmpeg-7\.1\.1\.tar\.xz) web.archive.org/web/2025id_/https://$1
