# Bazel downloader rewrite rules (see --downloader_config).
#
# Adds mirrors for upstream tarballs that come from flaky hosts and that we
# cannot annotate with `mirror_urls` ourselves because the module lives in the
# Bazel Central Registry rather than in modules/.
#
# Semantics: patterns match the URL without its scheme; every matching
# `rewrite` line contributes one candidate URL, tried in order. An identity
# rewrite keeps the original URL as the final fallback.
